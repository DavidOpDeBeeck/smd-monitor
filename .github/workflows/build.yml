name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the benchmark check can tell which commits a recorded run measured.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: gradle/actions/setup-gradle@v5

      - name: Check the page's formatting
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check

      # Every run file valid; on a pull request, also that it only adds runs, of committed trees (docs/benchmarks/README.md).
      - name: Check the benchmark runs
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I docs/benchmarks/benchmarks.py check ${BASE:+--base "$BASE" --head "$HEAD_SHA"}
          python3 -I docs/benchmarks/benchmarks.py page

      # Unit and integration tests, the bundled page, and the benchmarks' compilation.
      - name: Check
        run: ./gradlew check --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
