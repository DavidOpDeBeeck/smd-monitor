# The hub's defaults. An application.yaml in the directory the hub starts in, an environment variable, or a system property overrides each of them;
# docs/monitor.md describes them.
smd:
  monitor:
    hub:
      ui:
        port: 8080
        # address: 127.0.0.1   unset, the page's port listens on every address
        # allowed-origins: https://monitor.example, https://ops.example
        max-viewers: 128       # pages open at once; frames go out a second apart per 16 of them, at most 5 seconds
      otlp:
        port: 4318
        # address: 127.0.0.1   unset, the OTLP port listens on every address
      memory: 268435456      # bytes, 256 MB
      window: PT1M
      history: PT5M
      settle: PT5S
      link-horizon: PT60S
      max-applications: 100
      max-instances: 256
      max-types: 1000
      max-groups: 200
      max-edges: 5000
      silent-after: PT10S
      retire-after: PT10M

# Each logger's level, as log.level.<logger>: trace, debug, info, warn, error, or off; others log at info.
log:
  level:
    org.eclipse.jetty: warn
